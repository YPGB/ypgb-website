<!-- @dsCard group="Colors" viewport="700x120" name="Status colors" subtitle="Tailwind default palette — bg 100 / text 800 / border 200 / solid 600" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:10px;height:120px;font-family:var(--font-sans);font-size:13px">
<div style="flex:1;background:var(--status-success-bg);color:var(--status-success-fg);border:1px solid var(--status-success-border);border-radius:var(--radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600">Success<span style="font-family:var(--font-mono);font-size:10px;font-weight:400">green</span></div>
<div style="flex:1;background:var(--status-warning-bg);color:var(--status-warning-fg);border:1px solid var(--status-warning-border);border-radius:var(--radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600">Warning<span style="font-family:var(--font-mono);font-size:10px;font-weight:400">amber</span></div>
<div style="flex:1;background:var(--status-danger-bg);color:var(--status-danger-fg);border:1px solid var(--status-danger-border);border-radius:var(--radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600">Danger<span style="font-family:var(--font-mono);font-size:10px;font-weight:400">red</span></div>
<div style="flex:1;background:var(--status-info-bg);color:var(--status-info-fg);border:1px solid var(--status-info-border);border-radius:var(--radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600">Info<span style="font-family:var(--font-mono);font-size:10px;font-weight:400">sky</span></div>
</div>
