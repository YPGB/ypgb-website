name: ypgb-website

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: dev
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Windows bind mounts don't deliver file-change events into the container, and Turbopack's
      # polling doesn't pick them up either, so the dev target runs webpack with this poll interval.
      WATCH_POLL_INTERVAL_MS: '1000'
    volumes:
      - .:/app
      # Linux-built deps and Next cache stay in the container, separate from the Windows host copies
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - pnpm_store:/pnpm-store
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
  next_cache:
  pnpm_store:
